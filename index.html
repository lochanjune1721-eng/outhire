<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOAT.lol — who's the greatest?</title>
<meta name="theme-color" content="#0F0E0C">
<!-- The three hosts every page talks to. Opening the sockets during head
     parse means the first real request is not also paying for DNS and TLS. -->
<link rel="preconnect" href="https://lbxpatuwptkgmugpuezs.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- supabase-js is the last script in the body, so the parser would only
     start fetching it after the whole page. Start it here instead; no
     crossorigin, to match the plain <script src> that consumes it. -->
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
<link rel="stylesheet" href="/css/style.css">
<!-- Webfonts must never hold up the first paint. media="print" takes this
     off the render-blocking path; onload puts it back the moment it lands. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap"></noscript>
</head>
<body data-nav="categories">
<a class="skip" href="#main">Skip to content</a>
<header data-header></header>

<main id="main">
  <div class="wrap">
    <div class="livebar">
      <span class="livepill">
        <span class="dot dot-pulse" aria-hidden="true"></span>
        <b id="stat-online">—</b> online
        <span aria-hidden="true">·</span>
        <b id="stat-today">$0</b> backed today
      </span>
    </div>
    <div class="hero">
      <h1>Who&#8217;s the greatest?</h1>
      <p>Every argument is free. This one isn&#8217;t. <b>Load $5, back who you believe in</b> — the board is the money, nothing else.</p>
    </div>
    <div class="tabrow">
      <div class="tabs" role="tablist">
        <button class="tab is-active" role="tab" data-view="fights" aria-selected="true">Top fights</button>
        <button class="tab" role="tab" data-view="boards" aria-selected="false">All boards</button>
      </div>
      <label class="sortbox">
        <span>Sort</span>
        <select id="sort">
          <option value="closest">Closest race</option>
          <option value="hottest">Most backed</option>
          <option value="open">Still open</option>
          <option value="az">A–Z</option>
        </select>
      </label>
    </div>

    <nav id="chips" class="chiprow" aria-label="Filter by group"></nav>

    <div class="sechead">
      <h2 id="sec-title">Top fights right now</h2>
      <span id="sec-count" class="muted"></span>
    </div>

    <div id="fights" class="fights"><p class="empty">Loading the boards.</p></div>
    <div id="boards" class="boardgrid" hidden></div>
    <div id="more-wrap" class="morewrap" hidden>
      <button id="more" class="btn" type="button">Show more boards</button>
    </div>
    <div id="unclaimed"></div>
    <section class="group" id="activity">
      <div class="group-head">
        <h2><span class="dot dot-gold dot-pulse" aria-hidden="true" style="display:inline-block;margin-right:8px"></span>Live</h2>
        <a class="muted" href="/fans.html" style="font-size:13px">All backers</a>
      </div>
      <ul class="feed panel" id="feed"><li>Nothing backed yet.</li></ul>
    </section>
  </div>
</main>
<footer data-footer></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/js/img.js"></script><script src="/js/supabase.js"></script>
<script src="/js/seed-order.js"></script><script src="/js/board.js"></script><script src="/js/index.js"></script>
</body>
</html>
