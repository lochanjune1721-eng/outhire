<meta name="theme-color" content="#0F0E0C">
<!-- The three hosts every page talks to. Opening the sockets during head
     parse means the first real request is not also paying for DNS and TLS. -->
<link rel="preconnect" href="https://lbxpatuwptkgmugpuezs.supabase.co" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- supabase-js is the last script in the body, so the parser would only
     start fetching it after the whole page. Start it here instead; no
     crossorigin, to match the plain <script src> that consumes it. -->
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
<link rel="stylesheet" href="/css/style.css">
<!-- Webfonts must never hold up the first paint. media="print" takes this
     off the render-blocking path; onload puts it back the moment it lands. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap"></noscript>
</head>
<body data-nav="categories">

<header data-header></header>

<main id="main"><div class="wrap">
  <div id="cat-head" class="page" style="padding-bottom:14px"><p class="empty">Loading.</p></div>
  <div class="board" id="board" data-start="1"></div>
  <div id="pager" style="display:flex;justify-content:center;gap:8px;padding:26px 0"></div>
  <section class="panel" style="margin-top:20px" id="add-panel" hidden>
    <h2>Missing someone?</h2>
    <p class="muted" style="font-size:14px">Adding a name costs <b class="gold">$1</b> from your balance, and that dollar is their first backing. Real public figures only — a Wikipedia link is required.</p>
    <div class="field"><label for="add-name">Name</label><input id="add-name" type="text" maxlength="80"></div>
    <div class="field"><label for="add-wiki">Wikipedia URL</label><input id="add-wiki" type="url" placeholder="https://en.wikipedia.org/wiki/..."></div>
    <div class="field"><label for="add-blurb">One line <span class="muted">— optional</span></label><input id="add-blurb" type="text" maxlength="120"></div>
    <div id="add-error" class="notice notice-bad hide"></div>
    <div style="margin-top:16px"><button class="btn btn-gold" type="button" id="add-go">Add for $1</button></div>
  </section>
</div></main>
<footer data-footer></footer>
