<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin — GOAT.lol</title>
<meta name="theme-color" content="#0F0E0C">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/style.css">
</head>
<body data-nav="">
<a class="skip" href="#main">Skip to content</a>
<header data-header></header>

<main id="main"><div class="wrap page">
  <div id="login">
    <h1>Admin</h1>
    <p class="lede">The password is checked on the server, never in the browser.</p>
    <div class="panel" style="margin-top:22px"><form id="login-form">
      <div class="field" style="margin-top:0"><label for="pw">Password</label><input id="pw" type="password" required></div>
      <div id="login-error" class="notice notice-bad hide"></div>
      <div style="margin-top:16px"><button class="btn btn-gold" type="submit">Sign in</button></div>
    </form></div>
  </div>
  <div id="panel" class="hide">
    <h1>Review</h1>
    <p class="lede">Auto-fetch gives roughly 60% usable photos and some odd name choices. Three minutes a board is the difference between a site that looks made and one that looks scraped.</p>
    <div class="field" style="max-width:340px"><label for="cat">Board</label><select id="cat"></select></div>
    <div id="rows" class="panel" style="margin-top:18px"><p class="muted">Pick a board.</p></div>
  </div>
</div></main>
<footer data-footer></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/js/config.js"></script><script src="/js/supabase.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
